name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadless --no-progress
      - name: Validate the nginx config the image ships
        run: |
          docker run --rm -v "$PWD/nginx.conf":/etc/nginx/conf.d/default.conf:ro nginx:1.27-alpine nginx -t
