<a class="skip-link" href="#main-content">{{ 'app.skipToContent' | translate }}</a>

<mat-toolbar class="shell-toolbar">
  <mat-icon aria-hidden="true">shield</mat-icon>
  <span class="shell-toolbar__brand">{{ 'app.name' | translate }}</span>
  <span class="shell-toolbar__spacer"></span>
  <app-language-switcher></app-language-switcher>
  <button mat-stroked-button type="button" (click)="logout()">
    <mat-icon aria-hidden="true">logout</mat-icon>
    {{ 'nav.logout' | translate }}
  </button>
</mat-toolbar>

<mat-sidenav-container class="shell-container">
  <mat-sidenav mode="side" opened class="shell-sidenav" [attr.aria-label]="'nav.mainNavigation' | translate">
    <nav [attr.aria-label]="'nav.mainNavigation' | translate">
      <mat-nav-list>
        <a mat-list-item routerLink="/zones" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: false }">
          <mat-icon matListItemIcon aria-hidden="true">place</mat-icon>
          <span matListItemTitle>{{ 'nav.zones' | translate }}</span>
        </a>
        <a mat-list-item routerLink="/devices" routerLinkActive="active-link">
          <mat-icon matListItemIcon aria-hidden="true">sensors</mat-icon>
          <span matListItemTitle>{{ 'nav.devices' | translate }}</span>
        </a>
        <a mat-list-item routerLink="/alerts" routerLinkActive="active-link">
          <mat-icon matListItemIcon aria-hidden="true">notifications_active</mat-icon>
          <span matListItemTitle>{{ 'nav.alerts' | translate }}</span>
        </a>
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <main id="main-content" #mainContent class="shell-main" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
