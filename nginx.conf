server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The HTML shell names the current hashed bundles, so it must revalidate on every visit.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Angular emits content hashed bundles (main-ABCD1234.js), safe to cache for a long time.
    location ~* ^/[^/]+-[A-Z0-9]{8}\.(?:js|css)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fixed name files (icons, manifest, fonts, translations) can change between releases.
    location ~* \.(?:woff2?|png|jpg|jpeg|svg|ico|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.json$ {
        add_header Cache-Control "no-cache";
    }
}
